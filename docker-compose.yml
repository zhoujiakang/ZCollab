services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zcollab
      POSTGRES_DB: zcollab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zcollab}
    volumes:
      - ./server/sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcollab -d zcollab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zcollab
      SPRING_DATASOURCE_USERNAME: zcollab
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-zcollab}
      SPRING_DATA_REDIS_HOST: redis
    volumes:
      - uploads:/data/uploads

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  uploads:
