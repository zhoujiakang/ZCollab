<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">ZCollab — 让想法成文，让协作发生</title>
  <desc id="desc">面向窄屏的 ZCollab 项目封面，展示项目名称、文档协作主题与在线体验地址。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c33"/><stop offset="1" stop-color="#172e43"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="640" height="440" rx="24" fill="url(#bg)"/>
  <rect width="640" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="602" cy="300" r="175" fill="#56d4c0" opacity=".045"/>
  <circle cx="602" cy="300" r="130" fill="none" stroke="#76dfcd" stroke-opacity=".12"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="34" width="36" height="36" rx="10" fill="#74dfc7"/>
    <path d="M50 45h16l-16 15h16" fill="none" stroke="#132b3a" stroke-width="3" stroke-linejoin="round"/>
    <text x="92" y="59" fill="#b5c7d4" font-size="17" letter-spacing="2">个人开源 · 在线文档协作</text>
    <text x="36" y="167" fill="#fff" font-size="85" font-weight="700" letter-spacing="-3">ZCollab<tspan fill="#74dfc7">.</tspan></text>
    <text x="41" y="228" fill="#edf3f8" font-size="35" font-weight="550">让想法成文，让协作发生。</text>
    <text x="42" y="275" fill="#9eb2c4" font-size="22">文档整理 · 实时协作 · 分享与讨论</text>
    <rect x="41" y="328" width="234" height="52" rx="26" fill="#74dfc7"/>
    <text x="68" y="362" fill="#102a36" font-size="23" font-weight="650">docs.zzzink.cn</text>
    <path d="M548 339v34l10-9 10 17 9-5-11-17h18Z" fill="#b8a6fa" stroke="#192b3e" stroke-width="2"/>
